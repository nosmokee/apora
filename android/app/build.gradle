plugins { id 'com.android.application' }
android {
 namespace 'ru.opora.study'
 compileSdk 35
 defaultConfig {
  // New stable identity: old 0.6 signing key is unavailable. Coexists with 0.6.
  applicationId 'ru.opora.study.next'
  minSdk 26
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  targetSdk 35
  versionCode 18
  versionName '1.0.0'
 }
 signingConfigs {
  release {
   if (System.getenv('OPORA_KEYSTORE_PATH')) {
    storeFile file(System.getenv('OPORA_KEYSTORE_PATH'))
    storePassword System.getenv('OPORA_KEYSTORE_PASSWORD')
    keyAlias 'opora-next'
    keyPassword System.getenv('OPORA_KEYSTORE_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   if (System.getenv('OPORA_KEYSTORE_PATH')) signingConfig signingConfigs.release
   minifyEnabled false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
 implementation 'com.google.mlkit:translate:17.0.3'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
